<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VectorFlow - Client-Side Centerline SVG Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-zinc-100 min-h-screen selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;
        const { 
            Upload, 
            Download, 
            SlidersHorizontal, 
            RefreshCw, 
            Check, 
            Image: ImageIcon,
            Layers,
            Zap,
            Maximize2,
            FileCode 
        } = lucide;

        // --- COMPUTER VISION & ALGORITHM ENGINE ---
        class VectorizationEngine {
            static binarize(canvas, ctx, threshold) {
                const width = canvas.width;
                const height = canvas.height;
                const imgData = ctx.getImageData(0, 0, width, height);
                const pixels = imgData.data;

                let borderSum = 0;
                let borderCount = 0;
                for (let x = 0; x < width; x++) {
                    let idx = x * 4;
                    borderSum += (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
                    borderCount++;
                    idx = ((height - 1) * width + x) * 4;
                    borderSum += (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
                    borderCount++;
                }
                for (let y = 0; y < height; y++) {
                    let idx = (y * width) * 4;
                    borderSum += (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
                    borderCount++;
                    let idx2 = (y * width + (width - 1)) * 4;
                    borderSum += (pixels[idx2] + pixels[idx2+1] + pixels[idx2+2]) / 3;
                    borderCount++;
                }

                const avgBorder = borderSum / borderCount;
                const inverted = avgBorder > 128;

                const binary = new Uint8Array(width * height);
                for (let i = 0, p = 0; i < pixels.length; i += 4, p++) {
                    const avg = (pixels[i] + pixels[i+1] + pixels[i+2]) / 3;
                    if (inverted) {
                        binary[p] = avg < threshold ? 1 : 0;
                    } else {
                        binary[p] = avg > threshold ? 1 : 0;
                    }
                }
                return { data: binary, width, height };
            }

            static zhangSuenThinning(binary, width, height) {
                let grid = new Uint8Array(binary);
                let firstStep = true;
                let change = true;

                const getPixel = (x, y) => (x < 0 || x >= width || y < 0 || y >= height) ? 0 : grid[y * width + x];

                while (change) {
                    change = false;
                    const markers = [];

                    for (let y = 1; y < height - 1; y++) {
                        for (let x = 1; x < width - 1; x++) {
                            const p = y * width + x;
                            if (grid[p] === 0) continue;

                            const p2 = getPixel(x, y - 1);
                            const p3 = getPixel(x + 1, y - 1);
                            const p4 = getPixel(x + 1, y);
                            const p5 = getPixel(x + 1, y + 1);
                            const p6 = getPixel(x, y + 1);
                            const p7 = getPixel(x - 1, y + 1);
                            const p8 = getPixel(x - 1, y);
                            const p9 = getPixel(x - 1, y - 1);

                            const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
                            if (B < 2 || B > 6) continue;

                            let A = 0;
                            if (p2 === 0 && p3 === 1) A++;
                            if (p3 === 0 && p4 === 1) A++;
                            if (p4 === 0 && p5 === 1) A++;
                            if (p5 === 0 && p6 === 1) A++;
                            if (p6 === 0 && p7 === 1) A++;
                            if (p7 === 0 && p8 === 1) A++;
                            if (p8 === 0 && p9 === 1) A++;
                            if (p9 === 0 && p2 === 1) A++;

                            if (A !== 1) continue;

                            if (firstStep) {
                                if ((p2 * p4 * p6) !== 0) continue;
                                if ((p4 * p6 * p8) !== 0) continue;
                            } else {
                                if ((p2 * p4 * p8) !== 0) continue;
                                if ((p2 * p6 * p8) !== 0) continue;
                            }

                            markers.push(p);
                        }
                    }

                    if (markers.length > 0) {
                        change = true;
                        for (let i = 0; i < markers.length; i++) {
                            grid[markers[i]] = 0;
                        }
                    }
                    firstStep = !firstStep;
                    if (!change && !firstStep) change = true;
                }
                return grid;
            }

            static pruneSkeleton(grid, width, height) {
                const result = new Uint8Array(grid);
                const getP = (x, y) => (x < 0 || x >= width || y < 0 || y >= height) ? 0 : result[y * width + x];

                let modified = true;
                let iterations = 0;
                while (modified && iterations < 5) {
                    modified = false;
                    iterations++;
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            if (result[y * width + x] === 1) {
                                let neighbors = 0;
                                for (let dy = -1; dy <= 1; dy++) {
                                    for (let dx = -1; dx <= 1; dx++) {
                                        if ((dx !== 0 || dy !== 0) && getP(x + dx, y + dy) === 1) neighbors++;
                                    }
                                }
                                if (neighbors === 1) {
                                    let cx = x, cy = y;
                                    let length = 0;
                                    let path = [{x: cx, y: cy}];
                                    let validSpur = true;

                                    while (true) {
                                        length++;
                                        let nextX = -1, nextY = -1;
                                        let nNeighbors = 0;

                                        for (let dy = -1; dy <= 1; dy++) {
                                            for (let dx = -1; dx <= 1; dx++) {
                                                if ((dx !== 0 || dy !== 0) && getP(cx + dx, cy + dy) === 1) {
                                                    const nx = cx + dx;
                                                    const ny = cy + dy;
                                                    if (!path.some(p => p.x === nx && p.y === ny)) {
                                                        nNeighbors++;
                                                        nextX = nx;
                                                        nextY = ny;
                                                    }
                                                }
                                            }
                                        }

                                        if (nNeighbors === 1) {
                                            cx = nextX;
                                            cy = nextY;
                                            path.push({x: cx, y: cy});
                                        } else {
                                            validSpur = length < 5;
                                            break;
                                        }
                                    }

                                    if (validSpur && length < 5) {
                                        for (const p of path) {
                                            result[p.y * width + p.x] = 0;
                                        }
                                        modified = true;
                                    }
                                }
                            }
                        }
                    }
                }
                return result;
            }

            static tracePaths(grid, width, height) {
                const visited = new Uint8Array(width * height);
                const segments = [];
                const getP = (x, y) => (x < 0 || x >= width || y < 0 || y >= height) ? 0 : grid[y * width + x];

                const getNeighbors = (x, y) => {
                    const neighbors = [];
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            if (dx !== 0 || dy !== 0) {
                                const nx = x + dx;
                                const ny = y + dy;
                                if (getP(nx, ny) === 1) neighbors.push({ x: nx, y: ny });
                            }
                        }
                    }
                    return neighbors;
                };

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = y * width + x;
                        if (grid[idx] === 1 && visited[idx] === 0) {
                            let currentPath = [{ x, y }];
                            visited[idx] = 1;
                            let curr = { x, y };
                            let prev = null;

                            while (true) {
                                const currNeighbors = getNeighbors(curr.x, curr.y).filter(
                                    n => !prev || n.x !== prev.x || n.y !== prev.y
                                );
                                const totalNeighbors = getNeighbors(curr.x, curr.y);

                                if (currNeighbors.length === 1 && totalNeighbors.length <= 2) {
                                    const next = currNeighbors[0];
                                    const nextIdx = next.y * width + next.x;
                                    if (visited[nextIdx] === 1 && currentPath.length > 2) {
                                        currentPath.push(next);
                                        break;
                                    }
                                    visited[nextIdx] = 1;
                                    prev = curr;
                                    curr = next;
                                    currentPath.push(curr);
                                } else {
                                    if (currNeighbors.length > 0 && totalNeighbors.length > 2) {
                                        const next = currNeighbors[0];
                                        const nextIdx = next.y * width + next.x;
                                        if (visited[nextIdx] === 0) {
                                            visited[nextIdx] = 1;
                                            prev = curr;
                                            curr = next;
                                            currentPath.push(curr);
                                            continue;
                                        }
                                    }
                                    break;
                                }
                            }
                            if (currentPath.length > 1) {
                                segments.push({ points: currentPath });
                            }
                        }
                    }
                }
                return segments;
            }

            static simplifyPath(points, tolerance, autoTune) {
                if (points.length <= 2) return points;

                const perpendicDistance = (p, a, b) => {
                    const normalLength = Math.hypot(b.x - a.x, b.y - a.y);
                    if (normalLength === 0) return Math.hypot(p.x - a.x, p.y - a.y);
                    return Math.abs((p.x - a.x) * (b.y - a.y) - (p.y - a.y) * (b.x - a.x)) / normalLength;
                };

                const isSharpCorner = (pts, idx) => {
                    if (idx === 0 || idx === pts.length - 1) return true;
                    const prev = pts[idx - 1];
                    const curr = pts[idx];
                    const next = pts[idx + 1];
                    const v1 = { x: prev.x - curr.x, y: prev.y - curr.y };
                    const v2 = { x: next.x - curr.x, y: next.y - curr.y };
                    const dot = v1.x * v2.x + v1.y * v2.y;
                    const mag1 = Math.hypot(v1.x, v1.y);
                    const mag2 = Math.hypot(v2.x, v2.y);
                    if (mag1 === 0 || mag2 === 0) return false;
                    const angle = Math.acos(Math.max(-1, Math.min(1, dot / (mag1 * mag2)))) * (180 / Math.PI);
                    return angle < 150;
                };

                const rdp = (pts) => {
                    if (pts.length < 3) return pts;
                    let maxDist = 0;
                    let furthestIndex = 0;
                    const a = pts[0];
                    const b = pts[pts.length - 1];

                    for (let i = 1; i < pts.length - 1; i++) {
                        if (isSharpCorner(pts, i)) {
                            furthestIndex = i;
                            maxDist = 999999;
                            break;
                        }
                        const dist = perpendicDistance(pts[i], a, b);
                        if (dist > maxDist) {
                            maxDist = dist;
                            furthestIndex = i;
                        }
                    }

                    const effectiveTolerance = autoTune ? tolerance * 1.5 : tolerance;
                    if (maxDist > effectiveTolerance) {
                        const left = rdp(pts.slice(0, furthestIndex + 1));
                        const right = rdp(pts.slice(furthestIndex));
                        return [...left.slice(0, left.length - 1), ...right];
                    } else {
                        return [a, b];
                    }
                };

                return rdp(points);
            }

            static pointsToSvgPath(points) {
                if (points.length === 0) return '';
                if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
                let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
                if (points.length === 2) {
                    d += ` L ${points[1].x.toFixed(2)} ${points[1].y.toFixed(2)}`;
                    return d;
                }
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[i === 0 ? 0 : i - 1];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
                    const cp1x = p1.x + (p2.x - p0.x) / 6;
                    const cp1y = p1.y + (p2.y - p0.y) / 6;
                    const cp2x = p2.x - (p3.x - p1.x) / 6;
                    const cp2y = p2.y - (p3.y - p1.y) / 6;
                    d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
                }
                return d;
            }
        }

        // --- REACT MAIN APP ---
        function App() {
            const [imageSrc, setImageSrc] = useState(null);
            const [fileName, setFileName] = useState('icon-sample');
            const [threshold, setThreshold] = useState(128);
            const [tolerance, setTolerance] = useState(1.5);
            const [autoTune, setAutoTune] = useState(true);
            const [isProcessing, setIsProcessing] = useState(false);
            const [svgPaths, setSvgPaths] = useState([]);
            const [imageDimensions, setImageDimensions] = useState({ width: 0, height: 0 });
            const [copied, setCopied] = useState(false);
            const [activeTab, setActiveTab] = useState('preview');

            const fileInputRef = useRef(null);
            const canvasRef = useRef(null);

            const [exportSettings, setExportSettings] = useState({
                strokeWidth: 4,
                scale: 1,
                includeViewBox: true,
                strokeColor: '#000000'
            });

            const handleFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setFileName(file.name.replace(/\.[^/.]+$/, ''));
                const reader = new FileReader();
                reader.onload = (event) => setImageSrc(event.target.result);
                reader.readAsDataURL(file);
            };

            const processImage = useCallback(() => {
                if (!imageSrc) return;
                setIsProcessing(true);

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = imageSrc;
                img.onload = () => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    if (!ctx) return;

                    const maxDim = 800;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    setImageDimensions({ width: w, height: h });
                    ctx.drawImage(img, 0, 0, w, h);

                    const { data: binaryData } = VectorizationEngine.binarize(canvas, ctx, threshold);
                    const skeletonData = VectorizationEngine.zhangSuenThinning(binaryData, w, h);
                    const prunedData = VectorizationEngine.pruneSkeleton(skeletonData, w, h);
                    const rawSegments = VectorizationEngine.tracePaths(prunedData, w, h);

                    const processedPaths = [];
                    for (const seg of rawSegments) {
                        const simplifiedPoints = VectorizationEngine.simplifyPath(seg.points, tolerance, autoTune);
                        if (simplifiedPoints.length > 1) {
                            processedPaths.push(VectorizationEngine.pointsToSvgPath(simplifiedPoints));
                        }
                    }

                    setSvgPaths(processedPaths);
                    setIsProcessing(false);
                };
            }, [imageSrc, threshold, tolerance, autoTune]);

            useEffect(() => {
                if (imageSrc) {
                    const timer = setTimeout(processImage, 50);
                    return () => clearTimeout(timer);
                }
            }, [imageSrc, threshold, tolerance, autoTune, processImage]);

            const generateSvgMarkup = useCallback(() => {
                const { width, height } = imageDimensions;
                const scaledWidth = width * exportSettings.scale;
                const scaledHeight = height * exportSettings.scale;
                const viewBoxAttr = exportSettings.includeViewBox ? `viewBox="0 0 ${width} ${height}"` : '';
                const pathsMarkup = svgPaths.map(p => `  <path d="${p}" />`).join('\n');

                return `<svg xmlns="http://www.w3.org/2000/svg" width="${scaledWidth}" height="${scaledHeight}" ${viewBoxAttr} fill="none" stroke="${exportSettings.strokeColor}" stroke-width="${exportSettings.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10">
${pathsMarkup}
</svg>`;
            }, [imageDimensions, exportSettings, svgPaths]);

            const handleDownload = () => {
                const blob = new Blob([generateSvgMarkup()], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${fileName}-centerline.svg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const handleCopyCode = () => {
                navigator.clipboard.writeText(generateSvgMarkup());
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div className="min-h-screen bg-slate-950 text-zinc-100 flex flex-col font-sans">
                    <canvas ref={canvasRef} className="hidden" />

                    {/* Header */}
                    <header className="border-b border-zinc-800 bg-slate-900/50 backdrop-blur sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="bg-cyan-500/10 border border-cyan-500/20 p-2 rounded-xl text-cyan-400">
                                <i data-lucide="zap" className="w-5 h-5"></i>
                            </div>
                            <div>
                                <h1 className="text-base font-semibold tracking-wide text-zinc-100">VectorFlow</h1>
                                <p className="text-xs text-zinc-400">Client-Side PNG to Editable Centerline SVG Converter</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-3">
                            {imageSrc && (
                                <button
                                    onClick={() => { setImageSrc(null); setSvgPaths([]); }}
                                    className="px-3 py-1.5 text-xs font-medium text-zinc-400 hover:text-zinc-200 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-lg transition"
                                >
                                    Upload New
                                </button>
                            )}
                            <button
                                onClick={handleDownload}
                                disabled={svgPaths.length === 0}
                                className="flex items-center space-x-2 bg-cyan-500 hover:bg-cyan-400 disabled:bg-zinc-800 disabled:text-zinc-600 text-slate-950 font-medium px-4 py-2 rounded-xl text-xs transition shadow-lg cursor-pointer disabled:cursor-not-allowed"
                            >
                                <i data-lucide="download" className="w-4 h-4"></i>
                                <span>Export SVG</span>
                            </button>
                        </div>
                    </header>

                    {/* Workspace */}
                    <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
                        {/* Sidebar Controls */}
                        <aside className="lg:col-span-4 border-r border-zinc-800 bg-zinc-900/40 p-6 flex flex-col space-y-6 overflow-y-auto">
                            {!imageSrc ? (
                                <div className="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 rounded-2xl p-8 text-center bg-zinc-900/20 hover:border-cyan-500/50 transition group">
                                    <input
                                        type="file"
                                        ref={fileInputRef}
                                        onChange={handleFileUpload}
                                        accept="image/png, image/jpeg, image/webp"
                                        className="hidden"
                                        id="fileUploadInput"
                                    />
                                    <label htmlFor="fileUploadInput" className="cursor-pointer flex flex-col items-center">
                                        <div className="bg-zinc-800 border border-zinc-700 p-4 rounded-2xl text-zinc-400 group-hover:text-cyan-400 transition mb-4">
                                            <i data-lucide="upload" className="w-6 h-6"></i>
                                        </div>
                                        <h3 className="text-sm font-medium text-zinc-200 mb-1">Upload Icon / Line Art</h3>
                                        <p className="text-xs text-zinc-500 max-w-xs mb-4">PNG, JPG, or WebP. Processed locally.</p>
                                        <span className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-xs font-medium text-zinc-200">
                                            Browse Files
                                        </span>
                                    </label>
                                </div>
                            ) : (
                                <>
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <h2 className="text-xs font-semibold tracking-wider uppercase text-zinc-400 flex items-center space-x-2">
                                                <i data-lucide="sliders-horizontal" className="w-3.5 h-3.5 text-cyan-400"></i>
                                                <span>Engine Controls</span>
                                            </h2>
                                            {isProcessing && (
                                                <span className="flex items-center space-x-1.5 text-xs text-cyan-400 animate-pulse">
                                                    <i data-lucide="refresh-cw" className="w-3 h-3 animate-spin"></i>
                                                    <span>Tracing...</span>
                                                </span>
                                            )}
                                        </div>

                                        {/* Threshold */}
                                        <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-2">
                                            <div className="flex justify-between text-xs">
                                                <span className="text-zinc-300 font-medium">Binarization Threshold</span>
                                                <span className="text-cyan-400 font-mono">{threshold}</span>
                                            </div>
                                            <input
                                                type="range"
                                                min="0"
                                                max="255"
                                                value={threshold}
                                                onChange={(e) => setThreshold(Number(e.target.value))}
                                                className="w-full accent-cyan-500 bg-zinc-800 h-1.5 rounded-lg appearance-none cursor-pointer"
                                            />
                                        </div>

                                        {/* Tolerance */}
                                        <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-2">
                                            <div className="flex justify-between text-xs">
                                                <span className="text-zinc-300 font-medium">Simplification Tolerance (RDP)</span>
                                                <span className="text-cyan-400 font-mono">{tolerance.toFixed(1)}px</span>
                                            </div>
                                            <input
                                                type="range"
                                                min="0.5"
                                                max="5.0"
                                                step="0.1"
                                                value={tolerance}
                                                onChange={(e) => setTolerance(Number(e.target.value))}
                                                className="w-full accent-cyan-500 bg-zinc-800 h-1.5 rounded-lg appearance-none cursor-pointer"
                                            />
                                        </div>

                                        {/* Auto Tune */}
                                        <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex items-center justify-between">
                                            <div>
                                                <h4 className="text-xs font-medium text-zinc-300">Curvature Auto-Tune</h4>
                                                <p className="text-[11px] text-zinc-500">Smooths circles, preserves sharp corners.</p>
                                            </div>
                                            <button
                                                onClick={() => setAutoTune(!autoTune)}
                                                className={`w-10 h-6 flex items-center rounded-full p-1 transition ${autoTune ? 'bg-cyan-500 justify-end' : 'bg-zinc-800 justify-start'}`}
                                            >
                                                <div className="w-4 h-4 bg-slate-950 rounded-full shadow-md"></div>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Export Settings */}
                                    <div className="space-y-4 pt-2 border-t border-zinc-800">
                                        <h2 className="text-xs font-semibold tracking-wider uppercase text-zinc-400 flex items-center space-x-2">
                                            <i data-lucide="maximize-2" className="w-3.5 h-3.5 text-cyan-400"></i>
                                            <span>Export Settings</span>
                                        </h2>
                                        <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-4">
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-xs">
                                                    <span className="text-zinc-300 font-medium">Stroke Width</span>
                                                    <span className="text-cyan-400 font-mono">{exportSettings.strokeWidth}px</span>
                                                </div>
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="20"
                                                    value={exportSettings.strokeWidth}
                                                    onChange={(e) => setExportSettings({...exportSettings, strokeWidth: Number(e.target.value)})}
                                                    className="w-full accent-cyan-500 bg-zinc-800 h-1.5 rounded-lg appearance-none cursor-pointer"
                                                />
                                            </div>
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-xs">
                                                    <span className="text-zinc-300 font-medium">Scale Factor</span>
                                                    <span className="text-cyan-400 font-mono">{exportSettings.scale}x</span>
                                                </div>
                                                <select
                                                    value={exportSettings.scale}
                                                    onChange={(e) => setExportSettings({...exportSettings, scale: Number(e.target.value)})}
                                                    className="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 text-xs rounded-xl px-3 py-2 outline-none"
                                                >
                                                    <option value={1}>1x Original</option>
                                                    <option value={2}>2x High Density</option>
                                                    <option value={4}>4x Ultra HD</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </aside>

                        {/* Preview Area */}
                        <section className="lg:col-span-8 bg-slate-950 flex flex-col relative overflow-hidden">
                            <div className="border-b border-zinc-800 px-6 py-3 flex items-center justify-between bg-zinc-900/20">
                                <div className="flex items-center space-x-2 bg-zinc-900 border border-zinc-800 p-1 rounded-xl">
                                    <button
                                        onClick={() => setActiveTab('preview')}
                                        className={`flex items-center space-x-1.5 px-3 py-1.5 text-xs font-medium rounded-lg transition ${activeTab === 'preview' ? 'bg-cyan-500 text-slate-950 shadow' : 'text-zinc-400'}`}
                                    >
                                        <span>Preview</span>
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('code')}
                                        className={`flex items-center space-x-1.5 px-3 py-1.5 text-xs font-medium rounded-lg transition ${activeTab === 'code' ? 'bg-cyan-500 text-slate-950 shadow' : 'text-zinc-400'}`}
                                    >
                                        <span>SVG Code</span>
                                    </button>
                                </div>
                                {imageSrc && (
                                    <div className="text-xs text-zinc-500 font-mono">
                                        {imageDimensions.width} × {imageDimensions.height}px • {svgPaths.length} Paths
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 flex items-center justify-center p-8 overflow-auto">
                                {!imageSrc ? (
                                    <div className="text-center space-y-3">
                                        <div className="w-16 h-16 bg-zinc-900 border border-zinc-800 rounded-2xl flex items-center justify-center mx-auto text-zinc-600">
                                            <i data-lucide="layers" className="w-8 h-8"></i>
                                        </div>
                                        <p className="text-xs text-zinc-500">Awaiting graphic input...</p>
                                    </div>
                                ) : activeTab === 'preview' ? (
                                    <div className="relative border border-zinc-800 bg-zinc-900/30 rounded-2xl p-6 shadow-2xl flex items-center justify-center max-w-full max-h-full overflow-auto">
                                        <svg
                                            width={imageDimensions.width}
                                            height={imageDimensions.height}
                                            viewBox={`0 0 ${imageDimensions.width} ${imageDimensions.height}`}
                                            className="max-w-full max-h-[60vh] object-contain"
                                        >
                                            <image href={imageSrc} width={imageDimensions.width} height={imageDimensions.height} opacity="0.15" />
                                            {svgPaths.map((pathStr, idx) => (
                                                <path
                                                    key={idx}
                                                    d={pathStr}
                                                    fill="none"
                                                    stroke="#22d3ee"
                                                    strokeWidth={exportSettings.strokeWidth}
                                                    strokeLinecap="round"
                                                    strokeLinejoin="round"
                                                    strokeMiterlimit="10"
                                                />
                                            ))}
                                        </svg>
                                    </div>
                                ) : (
                                    <div className="w-full h-full max-h-[65vh] flex flex-col bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
                                        <div className="bg-zinc-800/50 px-4 py-2 border-b border-zinc-800 flex items-center justify-between">
                                            <span className="text-xs font-mono text-zinc-400">output.svg</span>
                                            <button
                                                onClick={handleCopyCode}
                                                className="text-xs text-cyan-400 hover:text-cyan-300 font-medium transition"
                                            >
                                                {copied ? 'Copied!' : 'Copy Code'}
                                            </button>
                                        </div>
                                        <pre className="flex-1 p-4 text-xs font-mono text-zinc-300 overflow-auto">
                                            {generateSvgMarkup()}
                                        </pre>
                                    </div>
                                )}
                            </div>
                        </section>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
